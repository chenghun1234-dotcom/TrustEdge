openapi: 3.0.0
info:
  title: TrustEdge - Real-time Wasm Attestation API
  description: >
    TrustEdge is the world's first edge-native real-time attestation engine designed for stablecoin and RWA issuers. 
    Built on WebAssembly (Wasm) and Cloudflare Workers, it provides deterministic Proof of Reserve (PoR) and 
    automated Genius Act compliance. Replace slow, expensive manual audits with high-performance, 
    cryptographically verifiable code at the edge.
  version: 1.0.0
  x-logo:
    url: "https://trustedge.chenghun1234.workers.dev/logo.png"

servers:
  - url: https://trustedge.chenghun1234.workers.dev
    description: Production Global Edge Node

paths:
  /api/audit:
    get:
      summary: Perform Real-time Solvency Audit
      description: >
        Triggers a real-time verification process comparing off-chain bank assets with on-chain token supply. 
        The verification logic is executed within a secure Wasm sandbox for 100% deterministic results.
      parameters:
        - name: issuer
          in: query
          description: Unique ID of the issuer/tenant to audit.
          required: false
          schema:
            type: string
            default: default
      responses:
        '200':
          description: Audit successfully completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReport'
        '401':
          description: Unauthorized - Invalid or missing API Key.
  
  /api/register:
    post:
      summary: Register New Issuer
      description: Onboard a new asset issuer by defining their on-chain and off-chain data sources.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuerConfig'
      responses:
        '200':
          description: Issuer registered successfully.

  /api/admin/status:
    get:
      summary: Global Compliance Monitor
      description: Retrieve the real-time compliance status of all registered issuers globally.
      responses:
        '200':
          description: Global status report.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    AuditReport:
      type: object
      properties:
        issuerId:
          type: string
        timestamp:
          type: integer
        assets:
          type: number
        liabilities:
          type: number
        solvencyRatio:
          type: number
        isSolvent:
          type: boolean
        proofHash:
          type: string
          description: Deterministic SHA-256 proof hash generated by Wasm.
    
    IssuerConfig:
      type: object
      required:
        - issuerId
        - chainType
        - tokenAddress
      properties:
        issuerId:
          type: string
        chainType:
          type: string
          enum: [ETH, POLYGON, XRPL, SOL]
        tokenAddress:
          type: string
        decimals:
          type: integer
        bankApiUrl:
          type: string
        bankApiKey:
          type: string

tags:
  - name: Core Audit
    description: Real-time Proof of Reserve operations.
  - name: Administration
    description: Multi-tenant and issuer management.
